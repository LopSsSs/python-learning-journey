<text x="740" y="70" font-family="Consolas, monospace" font-size="20" fill="#ffd43b" opacity=".9" xml:space="preserve">def aprender(dia):</text><text x="740" y="102" font-family="Consolas, monospace" font-size="20" fill="#ffd43b" opacity=".9" xml:space="preserve">    datos = leer('gastos.txt')</text><text x="740" y="134" font-family="Consolas, monospace" font-size="20" fill="#ffd43b" opacity=".9" xml:space="preserve">    total = sum(datos)</text><text x="740" y="166" font-family="Consolas, monospace" font-size="20" fill="#ffd43b" opacity=".9" xml:space="preserve">    return total</text><text x="740" y="198" font-family="Consolas, monospace" font-size="20" fill="#4b8bbe" opacity=".9" xml:space="preserve"></text><text x="740" y="230" font-family="Consolas, monospace" font-size="20" fill="#4b8bbe" opacity=".9" xml:space="preserve">SELECT categoria, SUM(importe)</text><text x="740" y="262" font-family="Consolas, monospace" font-size="20" fill="#4b8bbe" opacity=".9" xml:space="preserve">FROM gastos GROUP BY categoria;</text>
<rect width="1280" height="320" fill="url(#fade)"/>
</g>
